<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a">
        <animate attributeName="stop-color" values="#05050a;#0d0018;#05050a" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#10021f">
        <animate attributeName="stop-color" values="#10021f;#1f0038;#10021f" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1a0026">
        <animate attributeName="stop-color" values="#1a0026;#2b0033;#1a0026" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#ff00aa" />
      <stop offset="100%" stop-color="#8a2be2" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="url(#bgGradient)" rx="14" />

  <!-- scanline grid, synthwave floor effect -->
  <g stroke="#ff00aa" stroke-width="1" opacity="0.15">
    <line x1="0" y1="180" x2="900" y2="180" />
    <line x1="0" y1="195" x2="900" y2="195" />
    <line x1="0" y1="210" x2="900" y2="210" />
  </g>

  <!-- sun -->
  <circle cx="800" cy="60" r="34" fill="#ff5fc4" opacity="0.65">
    <animate attributeName="r" values="30;36;30" dur="3s" repeatCount="indefinite" />
  </circle>

  <text x="60" y="100" font-family="Verdana, sans-serif" font-size="46" font-weight="bold" fill="url(#textGradient)" filter="url(#glow)">
    ZAINAB SHARIF
  </text>

  <text x="62" y="140" font-family="Verdana, sans-serif" font-size="20" fill="#c9c9e8">
    Software Engineer · Web Developer
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
  </text>

  <text x="62" y="170" font-family="Consolas, monospace" font-size="14" fill="#00e5ff" opacity="0.9">
    &gt; building things that look like they belong to the brand behind them_
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </text>
</svg>
